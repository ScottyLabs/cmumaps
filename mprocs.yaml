procs:
  db:
    cmd: ["bun", "run", "dev:panel:db"]
    cwd: "<CONFIG_DIR>"
    env:
      DATABASE_URL: null
  server:
    cmd: ["bun", "run", "dev:panel:server"]
    cwd: "<CONFIG_DIR>"
    env:
      DATABASE_URL: null
      IGNORE_LOGIN: null
  web:
    cmd: ["bun", "run", "dev:panel:web"]
    cwd: "<CONFIG_DIR>"
    env:
      VITE_IGNORE_LOGIN: null
hide_keymap_window: true
proc_list_width: 28
scrollback: 5000
